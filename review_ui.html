<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pangolin Review</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f0e;
    --surface: #161817;
    --border: #2a2e2b;
    --text: #d6dbd6;
    --muted: #5a6059;
    --accent: #7ec97e;
    --accent-dim: #2a3d2a;
    --warn: #c9a84c;
    --warn-dim: #3a300e;
    --danger: #c96b6b;
    --danger-dim: #3a1a1a;
    --unsure: #7eb5c9;
    --unsure-dim: #1a2e3a;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    height: 100vh;
    display: grid;
    grid-template-rows: 44px 1fr;
    grid-template-columns: 1fr 280px;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    grid-column: 1 / -1;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 24px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  .progress-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
    width: 0%;
  }

  .progress-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .sighting-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  /* ── Main image area ── */
  main {
    position: relative;
    background: #080908;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #img-display {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    transition: opacity 0.15s ease;
  }

  #img-display.loading { opacity: 0.3; }

  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 64px;
    background: rgba(14,15,14,0.7);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: color 0.15s, border-color 0.15s;
    border-radius: 4px;
  }
  .nav-btn:hover { color: var(--text); border-color: var(--accent); }
  #btn-prev { left: 12px; }
  #btn-next { right: 12px; }

  .img-counter {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    background: rgba(14,15,14,0.8);
    padding: 4px 12px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }

  .reviewed-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 3px;
    display: none;
  }
  .reviewed-badge.show { display: block; }
  .reviewed-badge.present  { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); }
  .reviewed-badge.absent   { background: var(--danger-dim); color: var(--danger); border: 1px solid var(--danger); }
  .reviewed-badge.unsure   { background: var(--unsure-dim); color: var(--unsure); border: 1px solid var(--unsure); }

  /* ── Sidebar ── */
  aside {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .aside-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .aside-section h3 {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* Tag buttons */
  .tag-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .tag-btn {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.1s;
  }
  .tag-btn .key {
    font-size: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 2px;
    color: var(--muted);
    min-width: 20px;
    text-align: center;
  }
  .tag-btn:hover { border-color: var(--muted); color: var(--text); }

  .tag-btn.active-present  { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .tag-btn.active-absent   { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }
  .tag-btn.active-unsure   { background: var(--unsure-dim); border-color: var(--unsure); color: var(--unsure); }
  .tag-btn.active-good     { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .tag-btn.active-blurry   { background: var(--warn-dim);   border-color: var(--warn);   color: var(--warn);   }
  .tag-btn.active-partial  { background: var(--warn-dim);   border-color: var(--warn);   color: var(--warn);   }
  .tag-btn.active-dark     { background: #1a1a2a; border-color: #5a5aaa; color: #8888cc; }

  /* Notes */
  #notes-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px;
    border-radius: 4px;
    resize: none;
    height: 60px;
    outline: none;
  }
  #notes-input:focus { border-color: var(--accent); }

  /* Save button */
  #btn-save {
    width: 100%;
    padding: 10px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  #btn-save:hover { background: var(--accent); color: var(--bg); }
  #btn-save:disabled { opacity: 0.3; cursor: default; }

  /* Filmstrip */
  .filmstrip-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .filmstrip-wrap::-webkit-scrollbar { width: 4px; }
  .filmstrip-wrap::-webkit-scrollbar-track { background: transparent; }
  .filmstrip-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .film-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.1s;
  }
  .film-item:hover { background: var(--surface); border-color: var(--border); }
  .film-item.active { background: var(--surface); border-color: var(--accent); }

  .film-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }
  .film-dot.present { background: var(--accent); }
  .film-dot.absent  { background: var(--danger); }
  .film-dot.unsure  { background: var(--unsure); }

  .film-name {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .film-item.active .film-name { color: var(--text); }

  .film-sighting {
    font-family: var(--mono);
    font-size: 9px;
    color: #3a3e3a;
    flex-shrink: 0;
  }

  /* Export btn */
  .export-wrap {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  #btn-export {
    width: 100%;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }
  #btn-export:hover { border-color: var(--warn); color: var(--warn); }

  /* Keyboard hint */
  .hint {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .hint-item {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
  }
  .hint-key {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1px 4px;
    border-radius: 2px;
  }

  .empty-state {
    display: flex; align-items: center; justify-content: center;
    height: 100%;
    font-family: var(--mono);
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <span class="logo">🦔 PANGOLIN REVIEW</span>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-label" id="progress-label">0 / 0</span>
  </div>
  <span class="sighting-label" id="sighting-label">—</span>
</header>

<main>
  <img id="img-display" src="" alt="camera trap frame" />
  <button class="nav-btn" id="btn-prev">&#8592;</button>
  <button class="nav-btn" id="btn-next">&#8594;</button>
  <div class="img-counter" id="img-counter">— / —</div>
  <div class="reviewed-badge" id="reviewed-badge"></div>
</main>

<aside>
  <div class="aside-section">
    <h3>Presence</h3>
    <div class="tag-group">
      <button class="tag-btn" data-tag="presence" data-val="present">
        <span class="key">1</span> Pangolin present
      </button>
      <button class="tag-btn" data-tag="presence" data-val="absent">
        <span class="key">2</span> Absent / empty
      </button>
      <button class="tag-btn" data-tag="presence" data-val="unsure">
        <span class="key">3</span> Unsure
      </button>
    </div>
  </div>

  <div class="aside-section">
    <h3>Quality</h3>
    <div class="tag-group">
      <button class="tag-btn" data-tag="quality" data-val="good">
        <span class="key">Q</span> Good
      </button>
      <button class="tag-btn" data-tag="quality" data-val="blurry">
        <span class="key">W</span> Blurry / motion
      </button>
      <button class="tag-btn" data-tag="quality" data-val="partial">
        <span class="key">E</span> Partial / cropped
      </button>
      <button class="tag-btn" data-tag="quality" data-val="dark">
        <span class="key">R</span> Too dark
      </button>
    </div>
  </div>

  <div class="aside-section">
    <h3>Notes (optional)</h3>
    <textarea id="notes-input" placeholder="e.g. juvenile, two animals, known individual..."></textarea>
  </div>

  <div class="aside-section">
    <button id="btn-save">SAVE &amp; NEXT  →</button>
  </div>

  <div class="filmstrip-wrap" id="filmstrip"></div>

  <div class="hint">
    <span class="hint-item"><span class="hint-key">←→</span> navigate</span>
    <span class="hint-item"><span class="hint-key">Space</span> save+next</span>
    <span class="hint-item"><span class="hint-key">1-3</span> presence</span>
    <span class="hint-item"><span class="hint-key">Q-R</span> quality</span>
  </div>

  <div class="export-wrap">
    <button id="btn-export">⬇ export reviews.csv</button>
  </div>
</aside>

<script>
let frames = [];
let reviews = {};
let current = 0;
let presence = "";
let quality = "";

async function init() {
  const res = await fetch("/api/frames");
  const data = await res.json();
  frames = data.frames;
  reviews = data.reviews;
  buildFilmstrip();
  // Jump to first unreviewed
  const firstUnreviewed = frames.findIndex(f => !reviews[f.id]);
  current = firstUnreviewed >= 0 ? firstUnreviewed : 0;
  showFrame(current);
}

function buildFilmstrip() {
  const strip = document.getElementById("filmstrip");
  strip.innerHTML = "";
  frames.forEach((f, i) => {
    const el = document.createElement("div");
    el.className = "film-item";
    el.dataset.index = i;
    const r = reviews[f.id];
    const dotClass = r ? r.presence : "";
    el.innerHTML = `
      <div class="film-dot ${dotClass}"></div>
      <span class="film-name">${f.filename}</span>
      <span class="film-sighting">${f.sighting.replace("SIGHTING_","")}</span>`;
    el.addEventListener("click", () => { current = i; showFrame(i); });
    strip.appendChild(el);
  });
}

function updateFilmstrip() {
  const items = document.querySelectorAll(".film-item");
  items.forEach((el, i) => {
    el.classList.toggle("active", i === current);
    const f = frames[i];
    const r = reviews[f.id];
    const dot = el.querySelector(".film-dot");
    dot.className = "film-dot" + (r ? ` ${r.presence}` : "");
  });
  // Scroll active into view
  const active = document.querySelector(".film-item.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

function showFrame(idx) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(idx, frames.length - 1));
  current = idx;
  const f = frames[idx];

  // Image
  const img = document.getElementById("img-display");
  img.classList.add("loading");
  img.onload = () => img.classList.remove("loading");
  img.src = `/img/${f.sighting}/${f.filename}`;

  // Header
  document.getElementById("sighting-label").textContent = f.sighting.replace("SIGHTING_", "T");
  document.getElementById("img-counter").textContent = `${idx + 1} / ${frames.length}`;

  // Progress
  const done = Object.keys(reviews).length;
  const pct = frames.length ? Math.round((done / frames.length) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-label").textContent = `${done} / ${frames.length} reviewed`;

  // Load existing review
  const r = reviews[f.id];
  presence = r ? r.presence : "";
  quality  = r ? r.quality  : "";
  document.getElementById("notes-input").value = r ? (r.notes || "") : "";

  // Badge
  const badge = document.getElementById("reviewed-badge");
  if (r) {
    badge.textContent = `✓ ${r.presence} · ${r.quality}`;
    badge.className = `reviewed-badge show ${r.presence}`;
  } else {
    badge.className = "reviewed-badge";
  }

  renderTagButtons();
  updateFilmstrip();
}

function renderTagButtons() {
  document.querySelectorAll(".tag-btn").forEach(btn => {
    const tag = btn.dataset.tag;
    const val = btn.dataset.val;
    const current_val = tag === "presence" ? presence : quality;
    btn.className = "tag-btn" + (current_val === val ? ` active-${val}` : "");
  });
}

async function saveAndNext() {
  if (!frames.length) return;
  const f = frames[current];
  if (!presence || !quality) {
    // Highlight missing
    if (!presence) document.querySelectorAll("[data-tag='presence']").forEach(b => b.style.borderColor = "#c96b6b");
    if (!quality)  document.querySelectorAll("[data-tag='quality']").forEach(b => b.style.borderColor = "#c96b6b");
    setTimeout(() => {
      document.querySelectorAll(".tag-btn").forEach(b => b.style.borderColor = "");
      renderTagButtons();
    }, 800);
    return;
  }

  await fetch("/api/review", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      id: f.id,
      presence,
      quality,
      notes: document.getElementById("notes-input").value,
    }),
  });

  reviews[f.id] = { presence, quality, notes: document.getElementById("notes-input").value };
  presence = ""; quality = "";

  if (current < frames.length - 1) {
    showFrame(current + 1);
  } else {
    showFrame(current); // refresh badge/progress on last frame
  }
}

// ── Events ──
document.querySelectorAll(".tag-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const tag = btn.dataset.tag;
    const val = btn.dataset.val;
    if (tag === "presence") presence = val;
    else quality = val;
    renderTagButtons();
  });
});

document.getElementById("btn-save").addEventListener("click", saveAndNext);
document.getElementById("btn-prev").addEventListener("click", () => showFrame(current - 1));
document.getElementById("btn-next").addEventListener("click", () => showFrame(current + 1));
document.getElementById("btn-export").addEventListener("click", () => window.location = "/api/export");

document.addEventListener("keydown", e => {
  if (e.target === document.getElementById("notes-input")) return;
  const key = e.key;
  if (key === "ArrowLeft")       { showFrame(current - 1); return; }
  if (key === "ArrowRight")      { showFrame(current + 1); return; }
  if (key === " " || key === "Enter") { e.preventDefault(); saveAndNext(); return; }
  if (key === "1") { presence = "present"; renderTagButtons(); }
  if (key === "2") { presence = "absent";  renderTagButtons(); }
  if (key === "3") { presence = "unsure";  renderTagButtons(); }
  if (key === "q" || key === "Q") { quality = "good";    renderTagButtons(); }
  if (key === "w" || key === "W") { quality = "blurry";  renderTagButtons(); }
  if (key === "e" || key === "E") { quality = "partial";  renderTagButtons(); }
  if (key === "r" || key === "R") { quality = "dark";    renderTagButtons(); }
});

init();
</script>
</body>
</html>
