name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the light dependencies the tests need; torch/ultralytics are
      # not installed in CI.
      - name: Install
        run: pip install ruff==0.17.0 pytest==9.1.1 flask==3.1.3 PyYAML==6.0.3 Pillow==12.1.1
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Pytest
        run: pytest -q
